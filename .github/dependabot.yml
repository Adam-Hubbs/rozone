version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    groups:
      cargo-fuzz:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /editors/code
    schedule:
      interval: weekly
    ignore:
      # Must not exceed engines.vscode, or vsce refuses to package; raise it together with the engine.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm:
        patterns: ["*"]
