version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    groups:
      cargo-fuzz:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /editors/code
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
