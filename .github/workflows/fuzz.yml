name: Fuzz

# Scheduled, non-blocking fuzzing of the rozone_core and rozone_wasm input
# surfaces. See docs/fuzzing.md. Crash inputs are uploaded as artifacts.

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # install-action falls back to cargo-binstall, whose prebuilt cargo-fuzz is
      # musl-built and so defaults to the (uninstalled) musl target.
      FUZZ_TRIPLE: x86_64-unknown-linux-gnu
    strategy:
      fail-fast: false
      matrix:
        target: [index_queries, roxygen_block, manifest_json]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - name: Build
        run: cargo fuzz build -s none --fuzz-dir fuzz --target "$FUZZ_TRIPLE" ${{ matrix.target }}
      - name: Fuzz for five minutes
        run: cargo fuzz run -s none --fuzz-dir fuzz --target "$FUZZ_TRIPLE" ${{ matrix.target }} -- -max_total_time=300
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
