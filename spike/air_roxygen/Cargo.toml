[package]
name = "air_roxygen_spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Pin Air and its biome fork to the same revs; air_r_syntax types must match biome_rowan's.
air_r_parser = { git = "https://github.com/posit-dev/air", rev = "a2b36beaacf02dd921b7d0dedb8fda1d23c00b3d" }
air_r_syntax = { git = "https://github.com/posit-dev/air", rev = "a2b36beaacf02dd921b7d0dedb8fda1d23c00b3d" }
biome_rowan = { git = "https://github.com/lionel-/biome", rev = "a1296ea6ba363d8b8d8f02181b2a4ce9315c5ef9" }

[lib]
crate-type = ["cdylib", "rlib"]
