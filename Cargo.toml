[workspace]
resolver = "3"
members = ["crates/rozone_core", "crates/rozone_wasm"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Pin biome_rowan to the biome rev Air's Cargo.lock uses; air_r_syntax types must match biome_rowan's.
air_r_parser = { git = "https://github.com/posit-dev/air", rev = "1fb34aa2eecc7ac187c2b661a9044c99e9551aaa" }
air_r_syntax = { git = "https://github.com/posit-dev/air", rev = "1fb34aa2eecc7ac187c2b661a9044c99e9551aaa" }
biome_rowan = { git = "https://github.com/biomejs/biome", rev = "8c43bc0b620e0db4ec841ae20756acedcead9599" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rozone_core = { path = "crates/rozone_core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
